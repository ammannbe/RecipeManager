# Local Pocket ID (OpenID Connect provider) for testing the optional SSO login.
# Browser: https://recipemanager.ddev.site:14111 (first start: /setup), apps reach it at http://ddev-RecipeManager-pocket-id:1411.
# Development only: the encryption key below must never be used elsewhere.
services:
  pocket-id:
    container_name: ddev-${DDEV_SITENAME}-pocket-id
    image: pocketid/pocket-id:v2.19.1
    restart: "no"
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    expose:
      - "1411"
    environment:
      - VIRTUAL_HOST=$DDEV_HOSTNAME
      - HTTPS_EXPOSE=14111:1411
      - APP_URL=https://${DDEV_HOSTNAME}:14111
      # Container name, so the DDEV projects of the other apps reach it too (shared ddev_default network).
      - INTERNAL_APP_URL=http://ddev-${DDEV_SITENAME}-pocket-id:1411
      - ENCRYPTION_KEY=local-development-only-key-0123456789
      - STATIC_API_KEY=local-development-only-api-key
      - TRUST_PROXY=true
      - ANALYTICS_DISABLED=true
      - VERSION_CHECK_DISABLED=true
      # Application Configuration from the environment (the admin UI shows it read-only).
      # Mails go to DDEV's Mailpit (`ddev mailpit`).
      - UI_CONFIG_DISABLED=true
      - APP_NAME=Pocket ID (local)
      - SMTP_HOST=web
      - SMTP_PORT=1025
      - SMTP_TLS=none
      - SMTP_FROM=pocket-id@${DDEV_HOSTNAME}
      - EMAIL_ONE_TIME_ACCESS_AS_ADMIN_ENABLED=true
      - EMAIL_ONE_TIME_ACCESS_AS_UNAUTHENTICATED_ENABLED=true
      - EMAIL_VERIFICATION_ENABLED=true
      - EMAIL_LOGIN_NOTIFICATION_ENABLED=true
    volumes:
      - pocket-id-data:/app/data

volumes:
  pocket-id-data:
